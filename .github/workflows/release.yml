name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify tag matches package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(node -p "require('./packages/ui/package.json').version")
          workspace_version=$(node -p "require('./package.json').version")
          expected_tag="v${package_version}"
          if [ "$package_version" != "$workspace_version" ]; then
            echo "Root version ($workspace_version) does not match package version ($package_version)." >&2
            exit 1
          fi
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag ($RELEASE_TAG) does not match package version ($expected_tag)." >&2
            exit 1
          fi
      - run: npm run check
      - run: npm run pack:release
      - name: Create GitHub Release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" release-artifacts/*.tgz
          --title "$RELEASE_TAG"
          --generate-notes
